<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperio Viltrumita - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form id="bat-form" class="bat-container">

    <img src="imagens/images-removebg-preview.png" alt="imagem logo">
  
    <label for="email">Email do guerreiro:</label>
    <input type="email" id="email" name="email" placeholder="Ex: Nolan@gmail.com" required>

    <label for="senha">senha viltrumita:</label>
    <input type="password" id="senha" name="senha" placeholder="Ex: Viltrum123" required>

    <button type="submit" id="btnEntrar">Entrar no imperio viltrumita</button>
  </form>

  <div id="mensagemCadastro"> </div>

  <script src="script.js"></script>

  <script>
    const btnEntrar = document.querySelector('#btnEntrar')
    const mensagemCadastro = document.querySelector('#mensagemCadastro')

  
    const LoginEmail = document.querySelector('#email')
    const LoginSenha = document.querySelector('#senha')

    btnEntrar.addEventListener('click', (event) => {
      event.preventDefault()

      const emailDigitado = LoginEmail.value
      const senhaDigitada = LoginSenha.value

    
      if (!emailDigitado || !senhaDigitada) {
        mensagemCadastro.innerText = 'Preencha todos os campos insolente'
        return 
      }

    
      const emailSalvo = localStorage.getItem('emailSalvo')
      const senhaSalva = localStorage.getItem('senhaSalva')

    
      if (emailDigitado === emailSalvo && senhaDigitada === senhaSalva) {
      
        window.location.href = 'chat.html'
      } else {
        mensagemCadastro.innerText = 'Credenciais incorretas, insolente!'
      }
    })
  </script>
  
</body>
</html>
